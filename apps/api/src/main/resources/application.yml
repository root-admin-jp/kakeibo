spring:
  application:
    name: kakeibo-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kakeibo}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DB_USER:kakeibo}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: filesystem:../../db/migration
    baseline-on-migrate: true
  # SMTP 接続（MAIL_MODE=smtp のときだけ使用。送信サービスに依存しない共通設定、ADR-0014）
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
# DBアクセスは MyBatis (ADR-0009)。SQLは src/main/resources/mapper/*.xml に置く。
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${API_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
# 秘密は環境変数でのみ渡す (ADR-0005)。空の場合は起動時に一時キーを生成する（再起動で既存トークンは無効になる）。
kakeibo:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration-minutes: 1440
  mail:
    # log = コードをサーバーログに出す開発用モード / smtp = 実際にメール送信する (ADR-0014)
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:no-reply@example.com}
  otp:
    # コード再送の最小間隔（秒）。E2E などテスト環境でのみ 0 にして短縮する
    resend-interval-seconds: ${OTP_RESEND_INTERVAL_SECONDS:60}
  webauthn:
    # パスキー (WebAuthn) の RP 設定 (ADR-0014)。本番では自ドメインに合わせる
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: ${WEBAUTHN_RP_NAME:Kakeibo}
    origins: ${WEBAUTHN_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
